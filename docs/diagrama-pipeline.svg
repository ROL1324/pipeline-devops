<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 572" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Pipeline DevOps de la parte B</title>
  <desc id="desc">Flujo de integración continua y entrega continua con GitHub Actions y Docker, con el pipeline legado de CircleCI.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b5cad"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect width="1000" height="572" fill="#ffffff"/>

  <text x="40" y="36" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0b3d6b">Pipeline DevOps — Parte B</text>
  <text x="40" y="58" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6675">GitHub Actions + Docker · el pipeline de la parte A (CircleCI) se conserva como legado</text>

  <!-- Disparador -->
  <rect x="380" y="82" width="240" height="46" rx="10" fill="#eef4fb" stroke="#0b5cad" stroke-width="1.5"/>
  <text x="500" y="102" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#083b6e">push / pull request</text>
  <text x="500" y="119" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#44566c">rama main</text>

  <line x1="500" y1="128" x2="500" y2="154" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Banda CI -->
  <rect x="40" y="158" width="920" height="128" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/>
  <text x="62" y="184" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b3d6b">CI — .github/workflows/ci.yml</text>

  <rect x="62" y="196" width="195" height="70" rx="9" fill="#ffffff" stroke="#9bb7d4"/>
  <text x="160" y="225" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1c2430">Lint</text>
  <text x="160" y="247" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675">ESLint</text>

  <rect x="277" y="196" width="210" height="70" rx="9" fill="#ffffff" stroke="#9bb7d4"/>
  <text x="382" y="225" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1c2430">Tests</text>
  <text x="382" y="247" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675">Jest · Node 20 y 22</text>

  <rect x="507" y="196" width="195" height="70" rx="9" fill="#ffffff" stroke="#9bb7d4"/>
  <text x="605" y="225" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1c2430">Seguridad</text>
  <text x="605" y="247" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675">npm audit (SCA)</text>

  <rect x="722" y="196" width="216" height="70" rx="9" fill="#ffffff" stroke="#9bb7d4"/>
  <text x="830" y="225" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1c2430">Docker build</text>
  <text x="830" y="247" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675">+ smoke test</text>

  <line x1="500" y1="286" x2="500" y2="312" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Banda CD -->
  <rect x="40" y="316" width="920" height="128" rx="14" fill="#f3faf5" stroke="#b7d8c2"/>
  <text x="62" y="342" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14532d">CD — .github/workflows/cd.yml · solo tras CI verde</text>

  <rect x="62" y="354" width="225" height="70" rx="9" fill="#ffffff" stroke="#86b79b"/>
  <text x="175" y="383" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1c2430">Build &amp; push</text>
  <text x="175" y="405" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675">GHCR (ghcr.io)</text>

  <rect x="307" y="354" width="250" height="70" rx="9" fill="#ffffff" stroke="#86b79b"/>
  <text x="432" y="383" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1c2430">Smoke test</text>
  <text x="432" y="405" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675">imagen por digest</text>

  <rect x="577" y="354" width="260" height="70" rx="9" fill="#fbfefc" stroke="#5f8a70" stroke-dasharray="5 4"/>
  <text x="707" y="381" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1c2430">Deploy opcional</text>
  <text x="707" y="401" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675">SSH + docker pull</text>
  <text x="707" y="418" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7a8797">DEPLOY_ENABLED=true</text>

  <!-- Banda CircleCI -->
  <rect x="40" y="470" width="920" height="66" rx="12" fill="#fafafa" stroke="#d0d0d0"/>
  <text x="62" y="494" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#333333">CircleCI — pipeline de la parte A (actualizado a Node.js)</text>
  <text x="62" y="516" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6675">checkout → npm ci → ESLint → jest --coverage → artefacto coverage</text>

  <path d="M 380 105 H 22 V 503 H 38" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>

  <line x1="600" y1="555" x2="630" y2="555" stroke="#0b5cad" stroke-width="2"/>
  <text x="638" y="559" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675">flujo automático</text>
  <line x1="760" y1="555" x2="790" y2="555" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="798" y="559" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6675">legado / opcional</text>
</svg>
