name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Análisis estático (CodeQL)
    runs-on: ubuntu-latest
    # Code scanning es gratuito en repositorios públicos. En uno privado
    # requiere GitHub Advanced Security, por eso el job se omite si es privado.
    if: ${{ github.event.repository.private == false }}
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Analizar
        uses: github/codeql-action/analyze@v4
