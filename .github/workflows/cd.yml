name: CD

on:
  # Se dispara solo cuando el workflow CI termina correctamente en main.
  # Así nunca se publica una imagen de un commit que no ha pasado los tests.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Los tags de release y la ejecución manual también publican imagen.
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Clonar el commit validado
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular metadatos y tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Guardar referencia inmutable (digest)
        id: image
        run: echo "ref=${REGISTRY}/${IMAGE_NAME,,}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: Smoke test de la imagen publicada
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Arrancar el contenedor publicado
        run: docker run -d --name app-cd -p 3000:3000 "${{ needs.publish.outputs.image }}"

      - name: Comprobar que responde
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then
              echo "Smoke test OK"
              exit 0
            fi
            sleep 1
          done
          echo "El contenedor publicado no respondió"
          docker logs app-cd
          exit 1

      - name: Limpiar el contenedor
        if: always()
        run: docker rm -f app-cd || true

  deploy:
    name: Despliegue (opcional)
    needs: smoke-test
    # Se activa con la variable de repositorio DEPLOY_ENABLED=true.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configurar la clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Desplegar con Docker en el servidor
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "
            echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin &&
            docker pull '${{ needs.publish.outputs.image }}' &&
            docker stop app || true &&
            docker rm app || true &&
            docker run -d --name app --restart unless-stopped -p 3000:3000 '${{ needs.publish.outputs.image }}'
          "
