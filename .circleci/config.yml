# Pipeline de CI en CircleCI, actualizado en la parte B para la app Node.js.
# Se conserva como ejemplo de la modificacion del pipeline de la parte A;
# el pipeline principal del proyecto es GitHub Actions (.github/workflows).
version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:20.18

    working_directory: ~/repo

    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package-lock.json" }}
            - v1-deps-

      - run:
          name: Instalar dependencias
          command: npm ci

      - save_cache:
          key: v1-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Lint (ESLint)
          command: npm run lint

      - run:
          name: Tests con cobertura (Jest)
          command: npm run test:coverage

      - store_artifacts:
          path: coverage
          destination: coverage

workflows:
  ci:
    jobs:
      - build-and-test
