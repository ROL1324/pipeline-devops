# Pipeline de la parte A: CI con CircleCI para la aplicacion Python.
# Se parte del config.yml del zip (CircleCI 2.0 + circleci/python:3.7),
# actualizado a 2.1 y a una imagen mantenida (cimg/python:3.12) para que
# el pipeline pueda ejecutarse hoy. El original se conserva en
# docs/reference/config-original-circleci.yml.
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.12

    working_directory: ~/repo

    steps:
      # Paso 1: obtener el codigo fuente
      - checkout
      # Paso 2: crear el entorno virtual e instalar dependencias
      - run:
          name: Instalar dependencias
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      # Paso 3: linters (flake8) y tests (pytest)
      - run:
          name: Ejecutar flake8 y pytest
          command: |
            . venv/bin/activate
            flake8 --exclude=venv* --statistics
            pytest -v

workflows:
  ci-parte-a:
    jobs:
      - build
